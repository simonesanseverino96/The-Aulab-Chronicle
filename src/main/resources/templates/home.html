<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <head th:insert="~{index :: navbar}"></head>

    <!-- Alert messaggi -->
    <div th:if="${param.notAuthorized}" class="container mt-3">
      <div class="alert alert-danger">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>Non sei
        autorizzato!
      </div>
    </div>

    <div th:if="${successMessage}" class="container mt-3">
      <div class="alert alert-success">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMessage}"></span>
      </div>
    </div>

    <div th:if="${errorMessage}" class="container mt-3">
      <div class="alert alert-warning">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span th:text="${errorMessage}"></span>
      </div>
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
      <div class="container">
        <h1>
          <i class="fa-solid fa-newspaper me-3"></i>
          Aulab Chronicle
        </h1>
        <p class="lead">
          Il tuo portale di notizie - sempre aggiornato, sempre verificato
        </p>
        <a th:href="@{/articles}" class="btn btn-light btn-lg mt-3">
          <i class="fa-solid fa-list-ul me-2"></i>Tutti gli articoli
        </a>
      </div>
    </div>

    <!-- Ultimi articoli -->
    <div class="container my-5">
      <div th:if="${articles != null AND articles.size() > 0}">
        <h2 class="text-center mb-4 fw-bold">
          <i class="fa-solid fa-clock-rotate-left me-2"></i>Ultimi articoli
        </h2>
        <div class="row g-4 justify-content-center">
          <div th:each="article:${articles}" class="col-12 col-md-4 d-flex">
            <div class="card article-card w-100">
              <img
                th:src="${article.image != null} ? ${article.image.path} : '/images/default.jpg'"
                class="card-img-top"
                alt="Immagine articolo"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title" th:text="${article.title}"></h5>
                <p class="card-text" th:text="${article.subtitle}"></p>
                <p class="card-text text-muted">
                  <i class="fa-solid fa-user me-1"></i>
                  <span th:text="${article.user.username}"></span>
                </p>
                <a
                  th:href="@{/articles/detail/{id}(id=${article.id})}"
                  class="btn btn-primary mt-auto"
                >
                  <i class="fa-solid fa-book-open me-1"></i>Leggi
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div
        th:unless="${articles != null AND articles.size() > 0}"
        class="text-center py-5"
      >
        <i class="fa-solid fa-newspaper fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">Nessun articolo disponibile al momento</h4>
      </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
