<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <div th:insert="~{index :: navbar}"></div>

    <div class="container my-5 text-center">
      <div class="py-5">
        <i class="fa-solid fa-lock fa-5x text-danger mb-4"></i>
        <h1 class="display-1 fw-bold text-danger">403</h1>
        <h2 class="fw-bold mb-3">Accesso negato</h2>
        <p class="text-muted lead mb-4">
          Non hai i permessi necessari per visualizzare questa pagina.
        </p>
        <a th:href="@{/}" class="btn btn-primary rounded-pill px-4 py-2">
          <i class="fa-solid fa-house me-2"></i>Torna alla Home
        </a>
      </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
