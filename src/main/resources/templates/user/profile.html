<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <div th:insert="~{index :: navbar}"></div>

    <div class="container my-5">
      <div class="dashboard-header mb-4">
        <h1 class="fw-bold">
          <i class="fa-solid fa-user-gear me-2"></i>Il mio profilo
        </h1>
        <p class="lead opacity-75">
          Gestisci i tuoi dati personali e la sicurezza dell'account
        </p>
      </div>

      <div th:if="${successMessage}" class="alert alert-success">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMessage}"></span>
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span th:text="${errorMessage}"></span>
      </div>

      <div class="row g-4">
        <!-- Dati account -->
        <div class="col-12 col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-4">
              <i class="fa-solid fa-circle-info me-2 text-primary"></i>Dati
              account
            </h5>
            <p>
              <strong>Nome:</strong> <span th:text="${user.username}"></span>
            </p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p>
              <strong>Iscritto dal:</strong>
              <span
                th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy', new java.util.Locale('it'))}"
              ></span>
            </p>
            <p>
              <strong>Ruolo:</strong>
              <span
                th:each="role : ${user.roles}"
                class="badge bg-secondary"
                th:text="${role.name.replace('ROLE_', '')}"
              ></span>
            </p>
          </div>
        </div>

        <!-- Dati personali -->
        <div class="col-12 col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-4">
              <i class="fa-solid fa-person me-2 text-primary"></i>Dati personali
            </h5>
            <form th:action="@{/profile/update}" method="post">
              <div class="mb-3">
                <label class="form-label fw-semibold">Sesso (opzionale)</label>
                <select name="gender" class="form-select">
                  <option value="">-- Non specificato --</option>
                  <option value="M" th:selected="${user.gender == 'M'}">
                    Uomo
                  </option>
                  <option value="F" th:selected="${user.gender == 'F'}">
                    Donna
                  </option>
                  <option value="Altro" th:selected="${user.gender == 'Altro'}">
                    Altro
                  </option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold"
                  >Data di nascita (opzionale)</label
                >
                <input
                  type="date"
                  name="birthDate"
                  class="form-control"
                  th:value="${user.birthDate}"
                />
              </div>
              <button type="submit" class="btn btn-primary rounded-pill px-4">
                <i class="fa-solid fa-floppy-disk me-2"></i>Salva
              </button>
            </form>
          </div>
        </div>

        <!-- Cambia password -->
        <div class="col-12 col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4">
            <h5 class="fw-bold mb-4">
              <i class="fa-solid fa-key me-2 text-warning"></i>Cambia password
            </h5>
            <form th:action="@{/profile/change-password}" method="post">
              <div class="mb-3">
                <label class="form-label fw-semibold">Password attuale</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="currentPassword"
                    name="currentPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-secondary border"
                    type="button"
                    onclick="togglePassword('currentPassword', this)"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Nuova password</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    class="form-control"
                  />
                  <button
                    class="btn btn-outline-secondary border"
                    type="button"
                    onclick="togglePassword('newPassword', this)"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-warning rounded-pill px-4">
                <i class="fa-solid fa-lock me-2"></i>Cambia password
              </button>
            </form>
            <div class="mt-3">
              <a th:href="@{/forgot-password}" class="text-muted small">
                <i class="fa-solid fa-envelope me-1"></i>Reset via email
              </a>
            </div>
          </div>
        </div>

        <!-- Elimina account -->
        <div class="col-12 col-lg-6">
          <div class="card border-0 shadow-sm rounded-4 p-4 border-danger">
            <h5 class="fw-bold mb-4 text-danger">
              <i class="fa-solid fa-triangle-exclamation me-2"></i>Zona
              pericolosa
            </h5>
            <p class="text-muted small">
              Eliminando il tuo account perderai tutti i tuoi dati in modo
              permanente.
            </p>
            <form
              th:action="@{/profile/delete}"
              method="post"
              onsubmit="
                return confirm(
                  'Sei sicuro di voler eliminare il tuo account? Questa azione è irreversibile.',
                );
              "
            >
              <button type="submit" class="btn btn-danger rounded-pill px-4">
                <i class="fa-solid fa-trash me-2"></i>Elimina account
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>
    <script>
      function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }
    </script>
  </body>
</html>
