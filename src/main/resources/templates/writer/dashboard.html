<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}"></head>
<body>
    <head th:insert="~{index :: navbar}"></head>

    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>

    <div class="container min-vh-100">
        <div class="row">
            <div class="col-12 my-5 d-flex justify-content-center align-items-center">
                <span class="h1">Dashboard Writer</span>
            </div>

            <div class="col-12 my-5 d-flex justify-content-center align-items-center">
                <span class="h5" th:text="${title}">I tuoi articoli</span>
            </div>

            <div class="col-12">
                <table class="table table-striped table-responsive-lg">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Titolo</th>
                            <th>Sottotitolo</th>
                            <th>Categoria</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="article:${articles}">
                            <td th:text="${article.id}"></td>
                            <td th:text="${article.title}"></td>
                            <td th:text="${article.subtitle}"></td>
                            <td th:if="${article.category != null}"
                                th:text="${article.category.name}"></td>
                            <td th:unless="${article.category != null}">Nessuna categoria</td>
                            <td>
                                <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                   class="btn btn-primary m-2">
                                    <i class="fa-solid fa-bars"></i>
                                </a>
                                <a th:href="@{/articles/edit/{id}(id=${article.id})}"
                                   class="btn btn-warning m-2">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                                   class="btn btn-danger m-2">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
