<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

  <head th:insert="~{index :: navbar}"></head>

  <div class="container my-5 pb-5">
    <div class="dashboard-header">
      <h1 class="fw-bold">
        <i class="fa-solid fa-pen-to-square me-2"></i>
        <span th:text="${title}">Crea un articolo</span>
      </h1>
      <p class="lead opacity-75">
        Scrivi il tuo articolo e invialo in revisione
      </p>
    </div>
  </div>

  <div class="container my-5 pb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="form-card">
          <form th:action="@{/articles}" method="POST" th:object="${article}" enctype="multipart/form-data">
            <div class="form-group mb-3">
              <label for="articleTitle" class="form-label fw-semibold">
                <i class="fa-solid fa-heading me-1"></i>Titolo
              </label>
              <input id="articleTitle" type="text" class="form-control" th:field="*{title}"
                placeholder="Inserisci il titolo..." />
              <p th:errors="*{title}" class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}"></p>
            </div>

            <div class="form-group mb-3">
              <label for="articleSubtitle" class="form-label fw-semibold">
                <i class="fa-solid fa-align-left me-1"></i>Sottotitolo
              </label>
              <input id="articleSubtitle" type="text" class="form-control" th:field="*{subtitle}"
                placeholder="Inserisci un sottotitolo..." />
              <p th:errors="*{subtitle}" class="text-danger small mt-1" th:if="${#fields.hasErrors('subtitle')}"></p>
            </div>

            <div class="form-group mb-3">
              <label for="body" class="form-label fw-semibold">
                <i class="fa-solid fa-file-lines me-1"></i>Testo articolo
              </label>
              <textarea id="body" class="form-control" th:field="*{body}" rows="8"
                placeholder="Scrivi il tuo articolo..."></textarea>
              <p th:errors="*{body}" class="text-danger small mt-1" th:if="${#fields.hasErrors('body')}"></p>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="date" class="form-label fw-semibold">
                  <i class="fa-solid fa-calendar me-1"></i>Data pubblicazione
                </label>
                <input id="date" type="date" class="form-control" th:field="*{publishDate}" />
                <p th:errors="*{publishDate}" class="text-danger small mt-1"
                  th:if="${#fields.hasErrors('publishDate')}"></p>
              </div>

              <div class="col-md-6 mb-3">
                <label for="category" class="form-label fw-semibold">
                  <i class="fa-solid fa-tag me-1"></i>Categoria
                </label>
                <select id="category" th:field="*{category}" class="form-select">
                  <option value="">-- Seleziona categoria --</option>
                  <option th:each="category:${categories}" th:value="${category.id}" th:text="${category.name}">
                  </option>
                </select>
                <p th:errors="*{category}" class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}"></p>
              </div>
            </div>

            <div class="form-group mb-4">
              <label for="image" class="form-label fw-semibold text-dark mb-2">
                <i class="fa-solid fa-images me-1 text-primary"></i> Galleria Immagini
              </label>

              <div class="row g-3 align-items-stretch">

                <div class="col-12 col-md-7">
                  <div class="custom-upload-zone">
                    <input type="file" name="files" id="image" class="custom-upload-input" multiple
                      accept="image/png, image/jpeg, image/webp" onchange="previewMainImage(event)" />
                    <div class="py-3">
                      <i class="fa-solid fa-cloud-arrow-up fa-2x text-muted mb-2"></i>
                      <h6 class="mb-1">Trascina qui le immagini o <span class="text-primary fw-semibold">sfoglia</span>
                      </h6>
                      <p class="custom-upload-text mb-0">Formati: JPG, PNG, WEBP (max 10MB)</p>
                      <span
                        class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill px-2 py-1 mt-2 d-inline-block style-badge">
                        <i class="fa-solid fa-layer-group me-1"></i> Multi-selezione attiva
                      </span>
                    </div>
                  </div>
                </div>

                <div class="col-12 col-md-5">
                  <div class="custom-preview-card">
                    <div class="d-flex align-items-center gap-2 mb-2">
                      <i class="fa-solid fa-star text-warning small"></i>
                      <span class="custom-preview-title">Immagine di Copertina</span>
                    </div>
                    <div id="main-image-preview-container" class="custom-preview-img-container">
                      <img id="main-image-preview" src="/images/default.jpg" class="w-100 h-100 object-fit-cover"
                        alt="Anteprima principale">
                    </div>
                    <span class="custom-preview-footer">
                      Prima foto automatica
                    </span>
                  </div>
                </div>

              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fa-solid fa-paper-plane me-2"></i>Crea articolo
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <head th:insert="~{index :: footer}"></head>
  <script th:replace="~{index :: bootstrapScript}"></script>

  <script>
    function previewMainImage(event) {
      const files = event.target.files;
      const preview = document.getElementById('main-image-preview');
      if (files && files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
        }
        reader.readAsDataURL(files[0]);
      } else {
        preview.src = "/images/default.jpg";
      }
    }
  </script>
</body>

</html>
