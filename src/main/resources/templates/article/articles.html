<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>

  <body>
    <div th:insert="~{index :: navbar}"></div>

    <!-- Header pagina -->
    <div class="container my-5 pb-5">
      <div class="dashboard-header">
        <h1 class="fw-bold">
          <i class="fa-solid fa-newspaper me-2"></i>
          <span th:text="${title}">Articoli</span>
        </h1>
      </div>
    </div>

    <div class="container my-5 min-vh-100">
      <!-- Alert successo -->
      <div th:if="${successMessage}" class="alert alert-success">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMessage}"></span>
      </div>

      <!-- Lista articoli -->
      <div class="row g-4" th:if="${articles.size() > 0}">
        <div
          th:each="article:${articles}"
          class="col-12 col-md-6 col-lg-4 d-flex"
        >
          <div class="card article-card w-100">
            <img
              th:src="${#lists.isEmpty(article.images)} ? '/images/default.jpg' : ${article.images.^[primary == true]?.path ?: article.images[0].path}"
              class="card-img-top object-fit-cover"
              alt="Immagine articolo"
            />

            <div class="card-body d-flex flex-column">
              <span
                th:if="${article.category != null}"
                class="badge bg-primary mb-2"
                style="width: fit-content"
                th:text="${article.category.name}"
              >
              </span>
              <h5 class="card-title fw-bold" th:text="${article.title}"></h5>
              <p class="card-text text-muted" th:text="${article.subtitle}"></p>
              <p class="card-text mt-auto">
                <small class="text-muted">
                  <i class="fa-solid fa-user me-1"></i>
                  <span th:text="${article.user.username}"></span>
                </small>
                <small
                  class="text-muted ms-3"
                  th:if="${article.publishDate != null}"
                >
                  <i class="fa-solid fa-calendar me-1"></i>
                  <span th:text="${article.publishDate}"></span>
                </small>
              </p>
              <a
                th:href="@{/articles/detail/{id}(id=${article.id})}"
                class="btn btn-primary mt-3"
              >
                <i class="fa-solid fa-book-open me-1"></i>Leggi
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Nessun articolo -->
      <div th:unless="${articles.size() > 0}" class="text-center py-5">
        <i class="fa-solid fa-newspaper fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">Nessun articolo presente</h4>
      </div>
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
