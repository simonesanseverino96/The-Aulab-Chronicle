<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <head th:insert="~{index :: navbar}"></head>

    <div class="container mt-4 min-vh-100 pb-5">
      
      <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
      </div>

      <div class="row justify-content-center mb-5">
        <div class="col-12">
          <h5 class="text-center" th:text="${title}">Index articoli</h5>
        </div>
      </div>

      <div class="row" th:if="${articles.size() > 0}">
        <div
          th:each="article:${articles}"
          class="col-12 col-md-4 d-flex justify-content-center mb-4"
        >
          <div class="card h-100" style="width: 18rem"> <img
              th:src="${article.image != null} ? ${article.image.path} : '/images/default.jpg'"
              class="card-img-top"
              alt="Immagine articolo"
            />
            <div class="card-body d-flex flex-column"> <h5 class="card-title" th:text="${article.title}"></h5>
              <p class="card-text" th:text="${article.subtitle}"></p>
              <p class="card-text text-muted small" th:text="'Scritto da: ' + ${article.user.username}"></p>
              <a
                th:href="@{/articles/detail/{id}(id=${article.id})}"
                class="btn btn-primary mt-auto"
                >Leggi</a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center" th:unless="${articles.size() > 0}">
        <div class="col-12 text-center my-5">
          <h5>NESSUN ARTICOLO PRESENTE</h5>
        </div>
      </div>
      
    </div>

    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
