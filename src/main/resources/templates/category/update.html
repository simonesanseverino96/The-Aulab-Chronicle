<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

  <head th:insert="~{index :: navbar}"></head>


  <div class="dashboard-header mx-3 mt-4">
    <h2 class="fw-bold mb-1">
      <i class="fa-solid fa-folder-open me-2"></i>Modifica Categoria
    </h2>
    <p class="mb-0 opacity-75">Aggiorna il nome della categoria selezionata.</p>
  </div>

  <div class="container min-vh-50">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-card">
          <form th:action="@{/categories/update/{id}(id=${category.id})}" method="POST" th:object="${category}">
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">Nome categoria</label>
              <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Inserisci il nome..." />
              <p th:errors="*{name}" class="text-danger mt-1 mb-0" th:if="${#fields.hasErrors('name')}"></p>
            </div>
            <div class="d-flex gap-2 justify-content-center mt-4">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fa-solid fa-circle-check me-2"></i>Aggiorna categoria
              </button>
            </div>
          </form>
        </div>

        <!-- Torna Indietro -->
        <div class="text-center mt-4 mb-5">
          <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-lg">
            <i class="fa-solid fa-arrow-left me-2"></i>Torna Indietro
          </a>
        </div>
      </div>
    </div>
  </div>

  <head th:insert="~{index :: footer}"></head>
  <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
