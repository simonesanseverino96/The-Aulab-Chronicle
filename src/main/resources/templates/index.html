<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
>
  <!-- Fragment head -->
  <head th:fragment="head">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title th:text="${title}">Title</title>
  </head>

  <!-- Inizio navbar -->
  <body>
    <nav
      th:fragment="navbar"
      class="navbar navbar-expand-lg navbar-light bg-light"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Aulab Chronicle</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item" sec:authorize="hasRole('ROLE_WRITER')">
              <a class="nav-link" href="/articles/create">Crea articolo</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/articles">Tutti gli articoli</a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
              <div class="d-flex">
                <a class="nav-link" th:href="@{/admin/dashboard}"
                  >Dashboard admin</a
                >
                <div
                  class="mt-1"
                  th:if="${careerRequests != null AND careerRequests > 0}"
                >
                  <i class="fas fa-bell fa-1 pt-2"></i>
                  <span
                    class="badge rounded-pill bg-danger text-white px-1"
                    th:text="${careerRequests}"
                  ></span>
                </div>
              </div>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ROLE_REVISOR')">
              <div class="d-flex">
                <a class="nav-link" th:href="@{/revisor/dashboard}"
                  >Dashboard revisor</a
                >
                <div
                  class="mt-1"
                  th:if="${articlesToBeRevised != null AND articlesToBeRevised > 0}"
                >
                  <i class="fas fa-bell fa-1 pt-2"></i>
                  <span
                    class="badge rounded-pill bg-danger text-white px-1"
                    th:text="${articlesToBeRevised}"
                  ></span>
                </div>
              </div>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ROLE_WRITER')">
              <a class="nav-link" th:href="@{/writer/dashboard}"
                >Dashboard writer</a
              >
            </li>
          </ul>

          <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Accesso
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li sec:authorize="isAnonymous()">
                  <a
                    class="dropdown-item"
                    aria-current="page"
                    th:href="@{/register}"
                    >Register</a
                  >
                </li>
                <li sec:authorize="isAnonymous()">
                  <a
                    class="dropdown-item"
                    aria-current="page"
                    th:href="@{/login}"
                    >Login</a
                  >
                </li>
                <li sec:authorize="isAuthenticated()">
                  <a
                    class="dropdown-item"
                    aria-current="page"
                    th:href="@{/logout}"
                    >Logout</a
                  >
                </li>
              </ul>
            </li>
          </ul>

          <div
            sec:authorize="isAuthenticated()"
            th:text="'Benvenuto: ' + ${#authentication.principal.fullname} + ' - ' + ${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}"
          >
            Benvenuto
          </div>
        </div>
      </div>

      <!-- form ricerca -->
      <form class="d-flex" th:action="@{/articles/search}" method="get">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search"
          name="keyword"
          aria-label="Search"
        />
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </nav>
    <!-- fine navbar -->

    <!-- Footer -->
    <footer th:fragment="footer" class="bg-dark text-white pt-4">
      <div class="container">
        <div class="row justify-content-between">
          <!-- Company info -->
          <div class="col-md-4 mb-3">
            <a href="/"><h5>Aulab</h5></a>
          </div>
          <!-- Contact Info -->
          <div class="col-md-4 mb-3 text-end">
            <h5>Lavora con noi</h5>
            <a th:href="@{/operations/career/request}" class="btn btn-primary"
              >Richiedi</a
            >
          </div>
        </div>
        <div class="bg-secondary text-center py-2">
          <p class="mb-0">© 2026 Aulab Inst. All rights reserved.</p>
        </div>
      </div>
    </footer>
    <!-- fine del footer -->

    <!-- Fragment script bootstrap -->
    <script
      th:fragment="bootstrapScript"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <!-- Fine Fragment script bootstrap -->
  </body>
</html>
