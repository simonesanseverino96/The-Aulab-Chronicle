<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<!-- Fragment head -->

<head th:fragment="head">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title th:text="${title}">Title</title>
</head>

<!-- Inizio navbar -->

<body>
  <nav th:fragment="navbar" class="navbar navbar-expand-lg py-3 mb-4 shadow-sm"
    style="background-color: var(--dark-bg); border-bottom: 1px solid rgba(255,255,255,0.05);">
    <div class="container-fluid">

      <a class="navbar-brand text-uppercase fw-bold tracking-wider text-white" th:href="@{/}"
        style="font-size: 1.3rem; letter-spacing: 1px; transition: color 0.3s ease;">
        <i class="fa-solid fa-feather-pointed me-2" style="color: var(--secondary-color);"></i>Aulab <span
          style="color: var(--accent-color);">Chronicle</span>
      </a>

      <button class="navbar-toggler border-0 shadow-none text-white" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
        aria-label="Toggle navigation">
        <i class="fa-solid fa-bars-staggered" style="font-size: 1.4rem;"></i>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center gap-2">
          <li class="nav-item">
            <a class="nav-link text-white-50 px-3 py-2 rounded-3 text-decoration-none fw-medium" th:href="@{/articles}"
              style="transition: all 0.3s ease;"
              onmouseover="this.style.color='var(--secondary-color)'; this.style.backgroundColor='rgba(255,255,255,0.03)'"
              onmouseout="this.style.color='rgba(255,255,255,0.7)'; this.style.backgroundColor='transparent'">
              <i class="fa-regular fa-newspaper me-1 small"></i> Tutti gli articoli
            </a>
          </li>

          <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a class="nav-link text-white-50 px-3 py-2 rounded-3 fw-medium d-inline-flex align-items-center gap-2"
              th:href="@{/admin/dashboard}" style="transition: all 0.3s ease;"
              onmouseover="this.style.color='var(--secondary-color)'; this.style.backgroundColor='rgba(255,255,255,0.03)'"
              onmouseout="this.style.color='rgba(255,255,255,0.7)'; this.style.backgroundColor='transparent'">
              <span>Dashboard Admin</span>
              <span th:if="${careerRequests != null AND careerRequests > 0}" class="position-relative d-inline-block">
                <i class="fas fa-bell text-warning animate-bounce" style="font-size: 0.9rem;"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size: 0.55rem; padding: 0.25em 0.4em;" th:text="${careerRequests}"></span>
              </span>
            </a>
          </li>

          <li class="nav-item" sec:authorize="hasRole('ROLE_REVISOR')">
            <a class="nav-link text-white-50 px-3 py-2 rounded-3 fw-medium d-inline-flex align-items-center gap-2"
              th:href="@{/revisor/dashboard}" style="transition: all 0.3s ease;"
              onmouseover="this.style.color='var(--secondary-color)'; this.style.backgroundColor='rgba(255,255,255,0.03)'"
              onmouseout="this.style.color='rgba(255,255,255,0.7)'; this.style.backgroundColor='transparent'">
              <span>Dashboard Revisor</span>
              <span th:if="${articlesToBeRevised != null AND articlesToBeRevised > 0}"
                class="position-relative d-inline-block">
                <i class="fas fa-bell text-warning" style="font-size: 0.9rem;"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size: 0.55rem; padding: 0.25em 0.4em;" th:text="${articlesToBeRevised}"></span>
              </span>
            </a>
          </li>

          <li class="nav-item dropdown" sec:authorize="hasRole('ROLE_WRITER')">
            <a class="nav-link dropdown-toggle text-white-50 px-3 py-2 rounded-3 fw-medium" href="#" id="writerDropdown"
              role="button" data-bs-toggle="dropdown" aria-expanded="false" style="transition: all 0.3s ease;"
              onmouseover="this.style.color='var(--secondary-color)';"
              onmouseout="this.style.color='rgba(255,255,255,0.7)'">
              <i class="fa-solid fa-pen-fancy me-1 small"></i> Area Writer
            </a>
            <ul class="dropdown-menu dropdown-menu-dark border-0 shadow-lg p-2" aria-labelledby="writerDropdown"
              style="background-color: #1e2b37; border-radius: var(--border-radius);">
              <li>
                <a class="dropdown-item rounded-2 py-2" th:href="@{/writer/dashboard}">
                  <i class="fa-solid fa-chart-pie me-2 small text-muted"></i>La tua Dashboard
                </a>
              </li>
              <li>
                <hr class="dropdown-divider opacity-10">
              </li>
              <li>
                <a class="dropdown-item rounded-2 py-2" th:href="@{/articles/create}">
                  <i class="fa-solid fa-circle-plus me-2 small" style="color: var(--accent-color);"></i>Scrivi un
                  Articolo
                </a>
              </li>
            </ul>
          </li>
        </ul>

        <div class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-3 ms-auto mt-3 mt-lg-0">

          <form class="d-flex" th:action="@{/articles/search}" method="get">
            <div class="input-group" style="max-width: 240px;">
              <input class="form-control form-control-sm border-0 text-white px-3" type="search"
                placeholder="Cerca articoli..." name="keyword" aria-label="Search"
                style="background-color: rgba(255,255,255,0.08); border-radius: 20px 0 0 20px; font-size: 0.85rem;" />
              <button class="btn btn-sm border-0 text-white-50 px-3" type="submit"
                style="background-color: rgba(255,255,255,0.12); border-radius: 0 20px 20px 0;"
                onmouseover="this.style.color='white'; this.style.backgroundColor='var(--accent-color)'"
                onmouseout="this.style.color='rgba(255,255,255,0.5)'; this.style.backgroundColor='rgba(255,255,255,0.12)'">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </form>

          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-white fw-medium d-flex align-items-center gap-1 px-2" href="#"
                id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fa-regular fa-circle-user style='font-size: 1.1rem;'"></i> Account
              </a>
              <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark border-0 shadow-lg p-2"
                aria-labelledby="profileDropdown"
                style="background-color: #1e2b37; border-radius: var(--border-radius);">
                <li sec:authorize="isAnonymous()">
                  <a class="dropdown-item rounded-2 py-2" th:href="@{/register}"><i
                      class="fa-solid fa-user-plus me-2 text-muted small"></i>Registrati</a>
                </li>
                <li sec:authorize="isAnonymous()">
                  <a class="dropdown-item rounded-2 py-2" th:href="@{/login}"><i
                      class="fa-solid fa-right-to-bracket me-2 text-muted small"></i>Accedi</a>
                </li>
                <li sec:authorize="isAuthenticated()">
                  <a class="dropdown-item rounded-2 py-2 text-danger fw-medium" th:href="@{/logout}"><i
                      class="fa-solid fa-power-off me-2 small"></i>Disconnetti</a>
                </li>
              </ul>
            </li>
          </ul>

          <div sec:authorize="isAuthenticated()"
            class="navbar-text text-white d-flex align-items-center gap-2 px-3 py-1.5 shadow-inner"
            style="background-color: rgba(0, 0, 0, 0.2); border-radius: 30px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05);">
            <span class="fw-semibold text-white-50"><i class="fa-solid fa-circle text-success me-1"
                style="font-size: 0.5rem;"></i><span
                th:text="${#authentication.principal.fullname}">Utente</span></span>
            <span class="badge text-uppercase tracking-wide"
              style="font-size: 0.6rem; padding: 4px 8px; background-color: var(--accent-color); color: white; border-radius: 10px;"
              th:text="${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}">Ruolo</span>
          </div>

        </div>
      </div>
    </div>
  </nav>
  <!-- fine navbar -->

  <!-- Footer -->
  <footer th:fragment="footer" class="bg-dark text-white pt-4">
    <div class="container">
      <div class="row justify-content-between">
        <!-- Company info -->
        <div class="col-md-4 mb-3">
          <a href="/">
            <h5>Aulab</h5>
          </a>
        </div>
        <!-- Contact Info -->
        <div class="col-md-4 mb-3 text-end">
          <h5>Lavora con noi</h5>
          <a th:href="@{/operations/career/request}" class="btn btn-primary">Richiedi</a>
        </div>
      </div>
      <div class="bg-secondary text-center py-2">
        <p class="mb-0">© 2026 Aulab Inst. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <!-- fine del footer -->

  <!-- Fragment script bootstrap -->
  <script th:fragment="bootstrapScript"
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Fine Fragment script bootstrap -->
</body>

</html>
