<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <div th:insert="~{index :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5">
          <div class="form-card">
            <div class="text-center mb-4">
              <i class="fa-solid fa-envelope fa-3x text-primary mb-3"></i>
              <h2 class="fw-bold">Reset password</h2>
              <p class="text-muted">
                Inserisci la tua email per ricevere il link di reset
              </p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
              <span th:text="${successMessage}"></span>
            </div>

            <form method="post" th:action="@{/forgot-password}">
              <div class="mb-4">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Inserisci la tua email"
                />
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fa-solid fa-paper-plane me-2"></i>Invia link di
                  reset
                </button>
              </div>
            </form>
            <div class="text-center mt-3">
              <a th:href="@{/login}" class="text-muted small">Torna al login</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
