<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <div th:insert="~{index :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          <!-- Card form -->
          <div class="form-card">
            <!-- Titolo -->
            <div class="text-center mb-4">
              <i class="fa-solid fa-user-plus fa-3x text-primary mb-3"></i>
              <h2 class="fw-bold">Registrazione</h2>
              <p class="text-muted">Crea il tuo account per iniziare</p>
            </div>

            <!-- Alert successo -->
            <div th:if="${param.success}" class="alert alert-info">
              <i class="fa-solid fa-circle-check me-2"></i>
              Registrazione avvenuta con successo!
            </div>

            <form
              method="post"
              role="form"
              th:action="@{/register/save}"
              th:object="${user}"
              novalidate
            >
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">
                    <i class="fa-solid fa-user me-1"></i>Nome
                  </label>
                  <input
                    class="form-control"
                    type="text"
                    placeholder="Inserisci il nome"
                    th:field="*{firstName}"
                  />
                  <p
                    th:errors="*{firstName}"
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('firstName')}"
                  ></p>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label fw-semibold">
                    <i class="fa-solid fa-user me-1"></i>Cognome
                  </label>
                  <input
                    class="form-control"
                    type="text"
                    placeholder="Inserisci il cognome"
                    th:field="*{lastName}"
                  />
                  <p
                    th:errors="*{lastName}"
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('lastName')}"
                  ></p>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="fa-solid fa-envelope me-1"></i>Email
                </label>
                <input
                  class="form-control"
                  type="email"
                  placeholder="Inserisci la tua email"
                  th:field="*{email}"
                />
                <p
                  th:errors="*{email}"
                  class="text-danger small mt-1"
                  th:if="${#fields.hasErrors('email')}"
                ></p>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">
                  <i class="fa-solid fa-lock me-1"></i>Password
                </label>
                <input
                  class="form-control"
                  type="password"
                  placeholder="Inserisci la password"
                  th:field="*{password}"
                />
                <p
                  th:errors="*{password}"
                  class="text-danger small mt-1"
                  th:if="${#fields.hasErrors('password')}"
                ></p>
              </div>

              <div class="d-grid mb-3">
                <button class="btn btn-primary btn-lg" type="submit">
                  <i class="fa-solid fa-user-plus me-2"></i>Registrati
                </button>
              </div>

              <div class="text-center text-muted">
                Hai già un account?
                <a th:href="@{/login}" class="text-primary fw-semibold">
                  Accedi qui
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>
  </body>
</html>
