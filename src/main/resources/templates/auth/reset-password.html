<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{index :: head}"></head>
  <body>
    <div th:insert="~{index :: navbar}"></div>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5">
          <div class="form-card">
            <div class="text-center mb-4">
              <i class="fa-solid fa-lock fa-3x text-primary mb-3"></i>
              <h2 class="fw-bold">Nuova password</h2>
              <p class="text-muted">Inserisci la tua nuova password</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
              <span th:text="${errorMessage}"></span>
            </div>

            <form method="post" th:action="@{/reset-password}">
              <input type="hidden" name="token" th:value="${token}" />
              <div class="mb-4">
                <label class="form-label fw-semibold">Nuova password</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    class="form-control"
                    placeholder="Inserisci la nuova password"
                  />
                  <button
                    class="btn btn-outline-secondary border"
                    type="button"
                    onclick="togglePassword('newPassword', this)"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fa-solid fa-lock me-2"></i>Salva nuova password
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div th:insert="~{index :: footer}"></div>
    <script th:replace="~{index :: bootstrapScript}"></script>
    <script>
      function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }
    </script>
  </body>
</html>
