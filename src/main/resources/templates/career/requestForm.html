<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

  <head th:insert="~{index :: navbar}"></head>

  <!-- Hero Header -->
  <div class="dashboard-header mx-3 mt-4">
    <h2 class="fw-bold mb-1">
      <i class="fa-solid fa-paper-plane me-2"></i>Richiesta di Collaborazione
    </h2>
    <p class="mb-0 opacity-75">Invia una richiesta di ruolo alla redazione.</p>
  </div>

  <div class="container min-vh-100">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-card">
          <form th:action="@{/operations/career/request/save}" method="POST" th:object="${careerRequest}"
            enctype="multipart/form-data">

            <div class="mb-3">
              <label for="body" class="form-label fw-semibold">Motivo della richiesta</label>
              <textarea id="body" class="form-control" th:field="*{body}" rows="4"
                placeholder="Inserisci motivazione..."></textarea>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label fw-semibold">Per quale ruolo?</label>
              <select id="role" th:field="*{role}" class="form-select">
                <option th:each="role:${roles}" th:value="${role.id}"
                  th:text="${role.name.substring(role.name.indexOf('_') + 1)}">
                </option>
              </select>
            </div>

            <div class="d-flex justify-content-center mt-4">
              <button type="submit" class="btn btn-success btn-lg">
                <i class="fa-solid fa-circle-check me-2"></i>Effettua richiesta
              </button>
            </div>

          </form>
        </div>

        <!-- Torna Indietro -->
        <div class="text-center mt-4 mb-5">
          <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
            <i class="fa-solid fa-arrow-left me-2"></i>Torna Indietro
          </a>
        </div>

      </div>
    </div>
  </div>

  <head th:insert="~{index :: footer}"></head>
  <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
